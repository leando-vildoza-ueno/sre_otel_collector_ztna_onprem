# ZTNA On-Premise OTel Collector Config
#
# This config is used to collect metrics from the ZTNA On-Premise environment.

extensions:
  health_check:
    endpoint: 0.0.0.0:8080
    path: /health
    check_collector_pipeline:
      enabled: true
      interval: 30s
      exporter_failure_threshold: 3

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  prometheus:
    config:
