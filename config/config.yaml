# ZTNA On-Premise OTel Collector Config
#
# This config is used to collect metrics from the ZTNA On-Premise and OCI environment.

extensions:
  health_check:
    endpoint: 0.0.0.0:8080
    path: /health

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: ztna_metrics_ub_ztna01
          scrape_interval: 30s
          scrape_timeout: 15s
          metrics_path: /metrics
          scheme: http
          static_configs:
            - targets:
                - 192.168.36.86:60123
                - 192.168.36.87:60123 #ztna_metrics_ub_ztna02
              labels:
                environment: onprem
                source: ztna

