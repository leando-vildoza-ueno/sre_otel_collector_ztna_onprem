exporters:
  # OTLP → New Relic (traces/logs + métricas OTLP)
  otlphttp/newrelic:
    endpoint: ${NEW_RELIC_ENDPOINT}
    headers:
      api-key: ${NEW_RELIC_API_KEY}
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2000

  # Prometheus Remote Write → New Relic (para scrapeo Prometheus)
  prometheusremotewrite:
    endpoint: "https://metric-api.newrelic.com/prometheus/v1/write"
    headers:
      api-key: ${NEW_RELIC_API_KEY}
    external_labels:
      prometheus_server: platform-otel-collector-ztna-onpremise

  # Exportador de logging (solo en Dev)
  logging/debug:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors:
        - memory_limiter
        #- attributes/kong_labels
        #- transform/kong_metrics
        #- filter/keep_kong_and_custom
        - batch
        #- resource/kong
      exporters: [logging/debug, prometheusremotewrite]